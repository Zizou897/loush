{% extends "base/base.html" %}
{% load static %}
{% block content %}

<section class="bg-600 h-100">
    <div class="container">
        <div class="row">
            <div class="col-12">
            <h6 class="font-sans-serif text-primary fw-bold"></h6>
            <h1 class="mb-6">Dévénir partenaire</h1>
            <form id="agency" class="row g-3">

                <h1 class="text-center fs-2 mb-5">Informations de l'agence</h1>
                <div class="row mb-3">
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="agenceName">Nom de l'agence <span class="text-primary">*</span></label>
                        <input id="agenceName" type="name" class="form-control" placeholder="Ex: louhsira Immobilier" v-model="name">
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="inputLevel">Numéro de téléphone <span class="text-primary">*</span></label>
                        <input type="name" class="form-control" placeholder="22691893420" v-model="phone">
                    </div>
                    <div class="col-sm-6 col-md-4">
                        <label class="form-label" for="web">Site web <span class="text-primary">*</span></label>
                        <input type="url" id="web" class="form-control" placeholder="www.example.com" v-model="site_web">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-sm-6 col-md-6">
                        <label class="form-label" for="inputCategories">Adresse e-mail <span class="text-primary">*</span></label>
                        <input type="email" class="form-control" placeholder="mail@gmail.com" v-model="email">
                    </div>
                    <div class="col-sm-6 col-md-6">
                        <label class="form-label" for="agenceAdresse">Adresse de l'agence <span class="text-primary">*</span></label>
                        <input id="agenceAdresse" type="name" class="form-control" placeholder="Adresse complète" v-model="agency_address">
                    </div>
                </div>
                <hr>
                <h1 class="text-center fs-2 mb-5">Représentant de l'Agence</h1>
                <div class="row mb-3">
                    <div class="col-sm-12 col-md-12">
                        <label class="form-label" for="repres">Nom du représentant <span class="text-primary">*</span></label>
                        <input type="name" id="repres" class="form-control" placeholder="john diane" v-model="name_representative">
                    </div>
                </div>
                
                <div class="col-auto z-index-2">
                <button class="btn btn-primary" type="submit" @click.prevent="sendDataAgency()">Agence Immobilière</button>
                </div>
            </form>
        </div>
        </div>
    </div>
</section>

{% endblock content %}
