<section class=" bg-200" id="home">
    <div class="container">
        <div class="row align-items-center text-center"   >
            <h4 class="fw-bold pb-4">Nos parténaire</h4>
            <div class="d-flex justify-content-evenly">
                {% for partenaire in get_partenaires %}
                    <div class="card fa-card" style="width: 200px; height: 100px; ">
                        <img class="" src="{{partenaire.picture.url}}" alt="courses" style="width: 100%; height: 100%; border-radius: 5px;"/>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
</section>
