
<div class="modal fade" id="modalSearch" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalSearchLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content shadow-lg border-0 rounded-4" id="home_asking">
      <div class="modal-header bg-gradient text-color rounded-top-4 p-4">
        <h4 class="modal-title text-color fw-bold">🔍 Trouver votre maison idéale</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>

      <div class="modal-body px-4 py-4">

        <!-- Informations personnelles -->
        <div class="mb-5">
          <h5 class="fw-bold mb-3 text-color text-center">👤 Informations personnelles</h5>
          <div class="row g-3">
            <div class="col-md-4">
              <input type="text" class="form-control" placeholder="Nom et Prénom *" v-model="name">
            </div>
            <div class="col-md-4">
              <input type="tel" class="form-control" placeholder="Numéro de téléphone *" v-model="phone">
            </div>
            <div class="col-md-4">
              <input type="email" class="form-control" placeholder="Adresse e-mail *" v-model="email">
            </div>
          </div>
        </div>

        <!-- Préférences propriété -->
         <hr>
        <div class="mb-5">
          <h5 class="fw-bold mb-3 text-color text-center">🏡 Préférences de la propriété</h5>
          <div class="row g-3">
            <div class="col-md-3">
              <select class="form-select" v-model="type_propriete_rechercher">
                <option value="" hidden>Type de propriété *</option>
                {% for type in get_type_proprietes %}
                  <option>{{ type.libele }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-3">
              <select class="form-select" v-model="achat_or_location">
                <option value="" hidden>Achat ou Location</option>
                <option>Achat</option>
                <option>Location</option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="text" class="form-control" placeholder="Budget *" v-model="budjet">
            </div>
            <div class="col-md-3">
              <select class="form-select" v-model="nbr_chambre">
                <option value="" hidden>Nombre de chambres</option>
                <option>1 chambre</option>
                <option>2 chambres</option>
                <option>3 chambres</option>
                <option>4 chambres</option>
                <option>5 chambres</option>
              </select>
            </div>
          </div>

          <div class="row g-3 mt-2">
            <div class="col-md-3">
              <select class="form-select" v-model="nbr_salle_bain">
                <option value="" hidden>Salles de bain</option>
                <option>1 salle</option>
                <option>2 salles</option>
                <option>3 salles</option>
                <option>4 salles</option>
                <option>5 salles</option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="text" class="form-control" placeholder="Surface (m²)" v-model="surface_habitable">
            </div>
            <div class="col-md-3">
              <multiselect
              v-model="select_features_local"
              :options="all_features_local"
              :multiple="true"
              :preserve-search="true"
              :select-label="'sélectionner'"
              :selected-label="'Sélectionné'"
              :deselect-label="'Supprimer'"
              filter
              placeholder="Les Localités"
              
              class="w-100"
            > </multiselect>
            </div>
            <div class="col-md-3">
              <multiselect
              v-model="select_features"
              :options="all_features"
              :multiple="true"
              :preserve-search="true"
              :select-label="'sélectionner'"
              :selected-label="'Sélectionné'"
              :deselect-label="'Supprimer'"
              filter
              placeholder="Les caractéristiques"
              
              class="w-100"
            > </multiselect>
            </div>
          </div>
        </div>

        <!-- Autres préférences -->
         <hr>
        <div class="mb-5">
          <h5 class="fw-bold mb-3 text-color text-center">📅 Autres préférences</h5>
          <div class="row g-3">
            {% comment %} <div class="col-md-6">
              <input type="date" class="form-control" v-model="date_demenag_souhaite">
            </div> {% endcomment %}
            <div class="col-md-12">
              <textarea class="form-control" rows="3" placeholder="Commentaires ou besoins spécifiques..." v-model="comments_souhaite"></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- Boutons d'action -->
      <div class="modal-footer d-flex justify-content-between px-4 py-3 bg-light rounded-bottom-4">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          ❌ Fermer
        </button>
        <button type="button" class="btn btn-primary px-4" @click.prevent="sendData()">
          📩 Envoyer la demande
        </button>
      </div>
    </div>
  </div>
</div>
